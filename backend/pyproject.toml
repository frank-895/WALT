[project]
name = "walt-api"
version = "0.1.0"
description = "WALT API"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]",
    "pydantic-ai",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest",
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
