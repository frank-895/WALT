name: walt

services:
  backend:
    build:
      context: ./backend
      target: development
    init: true
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend-venv:/app/.venv
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      target: development
    init: true
    environment:
      WALT_BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5173').then(response => { if (!response.ok) process.exit(1) })"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  backend-venv:
  frontend-node-modules:
